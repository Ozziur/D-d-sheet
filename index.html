<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3E9D2">
<title>Scheda D&amp;D 5e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --primary:#6750a4;--on-primary:#fff;--primary-container:#eaddff;--on-primary-container:#21005d;
  --secondary:#625b71;--secondary-container:#e8def8;--on-secondary-container:#1d192b;
  --tertiary:#7d5260;--tertiary-container:#ffd8e4;--on-tertiary-container:#31111d;
  --surface:#fef7ff;--on-surface:#1d1b20;--on-surface-variant:#49454f;
  --sc-lowest:#fff;--sc-low:#f7f2fa;--sc:#f3edf7;--sc-high:#ece6f0;--sc-highest:#e6e0e9;
  --outline:#79747e;--outline-variant:#cac4d0;
  --error:#b3261e;--on-error:#fff;--error-container:#f9dedc;--on-error-container:#410e0b;
  --inverse-surface:#322f35;--inverse-on-surface:#f5eff7;--scrim:rgba(0,0,0,.32);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --primary:#d0bcff;--on-primary:#381e72;--primary-container:#4f378b;--on-primary-container:#eaddff;
    --secondary:#ccc2dc;--secondary-container:#4a4458;--on-secondary-container:#e8def8;
    --tertiary:#efb8c8;--tertiary-container:#633b48;--on-tertiary-container:#ffd8e4;
    --surface:#141218;--on-surface:#e6e0e9;--on-surface-variant:#cac4d0;
    --sc-lowest:#0f0d13;--sc-low:#1d1b20;--sc:#211f26;--sc-high:#2b2930;--sc-highest:#36343b;
    --outline:#938f99;--outline-variant:#49454f;
    --error:#f2b8b5;--on-error:#601410;--error-container:#8c1d18;--on-error-container:#f9dedc;
    --inverse-surface:#e6e0e9;--inverse-on-surface:#322f35;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#d0bcff;--on-primary:#381e72;--primary-container:#4f378b;--on-primary-container:#eaddff;
  --secondary:#ccc2dc;--secondary-container:#4a4458;--on-secondary-container:#e8def8;
  --tertiary:#efb8c8;--tertiary-container:#633b48;--on-tertiary-container:#ffd8e4;
  --surface:#141218;--on-surface:#e6e0e9;--on-surface-variant:#cac4d0;
  --sc-lowest:#0f0d13;--sc-low:#1d1b20;--sc:#211f26;--sc-high:#2b2930;--sc-highest:#36343b;
  --outline:#938f99;--outline-variant:#49454f;
  --error:#f2b8b5;--on-error:#601410;--error-container:#8c1d18;--on-error-container:#f9dedc;
  --inverse-surface:#e6e0e9;--inverse-on-surface:#322f35;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--surface);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--surface);color:var(--on-surface);
  font:400 14px/20px "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{display:block;flex:none}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--outline-variant)}}

/* Top app bar */
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 8px 0 16px;background:var(--surface);flex:none;transition:background .2s}
.top.scrolled{background:var(--sc)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
.top-title{flex:1;min-width:0;text-align:left;display:block}
.top-title b{display:block;font-size:18px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{display:block;font-size:12px;line-height:16px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-variant);flex:none}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.mode{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);font-size:12px;font-weight:500;color:var(--on-surface-variant);flex:none}
.mode[data-m="a"]{background:var(--tertiary-container);color:var(--on-tertiary-container);border-color:transparent}
.mode[data-m="d"]{background:var(--error-container);color:var(--on-error-container);border-color:transparent}

/* Main */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main.fab-pad{padding-bottom:96px}

/* Nav bar */
.nav{display:flex;flex:none;height:80px;padding:12px 8px 16px;background:var(--sc)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--on-surface-variant);font-size:12px;line-height:16px;font-weight:500}
.nav .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"]{color:var(--on-surface);font-weight:700}
.nav button[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}

/* Cards & text */
.card{background:var(--sc);border-radius:24px;padding:16px}
.h{font-size:16px;line-height:24px;font-weight:600;margin:0}
.sub{font-size:12px;line-height:16px;color:var(--on-surface-variant)}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.hint{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin:0 4px}
.empty{padding:24px 16px;text-align:center;color:var(--on-surface-variant);background:var(--sc-low);border-radius:24px}

/* Buttons */
.btn{height:40px;padding:0 24px;border-radius:20px;background:var(--primary);color:var(--on-primary);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outline{background:none;border:1px solid var(--outline);color:var(--primary)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error-container);color:var(--on-error-container)}
.btn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:16px}
.btn.full{width:100%}
.btn:active,.pill:active,.abil:active,.tile.tap:active{filter:brightness(.94)}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline-variant);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip.warn[aria-pressed="true"]{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.fab{position:absolute;right:16px;bottom:96px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:20}
.fab[hidden]{display:none}

/* HP card */
.hp-card{background:var(--primary-container);color:var(--on-primary-container);padding:16px 16px 20px}
.hp-card.low{background:var(--error-container);color:var(--on-error-container)}
.hp-top{display:flex;align-items:center;gap:8px}
.hp-num{flex:1;display:flex;align-items:baseline;gap:8px}
.hp-cur{font-size:64px;line-height:64px;font-weight:700;letter-spacing:-1px}
.hp-max{font-size:24px;line-height:32px;opacity:.75;font-weight:500}
.hp-card .icon-btn{color:inherit}
.tmp-chip{height:28px;padding:0 10px;border-radius:8px;background:color-mix(in srgb,currentColor 16%,transparent);display:inline-flex;align-items:center;font-weight:600;font-size:13px}
.bar{height:14px;border-radius:7px;background:color-mix(in srgb,currentColor 18%,transparent);margin:10px 0 16px;overflow:hidden}
.bar>div{height:100%;border-radius:7px;background:var(--primary);transition:width .3s}
.hp-card.low .bar>div{background:var(--error)}
.hp-actions{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;height:48px;border-radius:24px;background:color-mix(in srgb,currentColor 10%,transparent);flex:none}
.stepper button{width:44px;height:48px;font-size:22px;font-weight:500;border-radius:24px}
.stepper input{width:44px;height:48px;border:0;background:none;text-align:center;font-size:20px;font-weight:600;color:inherit;outline:0;-moz-appearance:textfield;padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hp-actions .btn{flex:1;height:48px;border-radius:24px;font-size:15px}
.hp-card .btn.danger{background:var(--error-container);color:var(--on-error-container)}
.hp-card.low .btn.danger{background:var(--error);color:var(--on-error)}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--sc-high);border-radius:16px;padding:10px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile .v{font-size:24px;line-height:28px;font-weight:600}
.tile .l{font-size:12px;line-height:16px;color:var(--on-surface-variant)}

/* Abilities */
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.abil{background:var(--sc);border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.abil-name{font-size:12px;line-height:16px;color:var(--on-surface-variant);font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abil-mod{font-size:34px;line-height:38px;font-weight:700}
.abil-score{min-width:48px;height:32px;padding:0 12px;border-radius:16px;background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600;font-size:14px}

.row-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-line .grow{flex:1}

/* Dots (proficiency / saves) */
.dot{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:50%}
.dot i{width:16px;height:16px;border-radius:50%;border:2px solid var(--outline);transition:.15s}
.dot[data-p="1"] i{background:var(--primary);border-color:var(--primary)}
.dot[data-p="2"] i{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--primary)}
.dot.s i{border-color:var(--outline)}
.dot.s[data-p="1"] i{background:var(--error);border-color:var(--error)}
.dot.f[data-p="1"] i{background:var(--error);border-color:var(--error)}

/* Saves & skills */
.saves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.save{display:flex;align-items:center;height:48px;border-radius:16px;background:var(--sc);cursor:pointer;padding-right:8px;min-width:0}
.save .dot{width:36px}
.save .n{flex:1;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save .b,.skill .b{font-weight:600;font-size:15px}
.skills{display:grid;grid-auto-flow:column;grid-template-rows:repeat(9,auto);grid-template-columns:1fr 1fr;gap:6px 8px}
.skill{display:flex;align-items:center;height:46px;border-radius:14px;background:var(--sc);cursor:pointer;padding-right:10px;min-width:0}
.skill .dot{width:34px}
.skill .n{flex:1;min-width:0;line-height:16px;font-size:13px}
.skill .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill .n small{font-size:11px;line-height:12px;color:var(--on-surface-variant)}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:4px;background:var(--sc);border-radius:20px;padding:8px 8px 8px 16px;min-height:64px}
.row-main{flex:1;min-width:0;text-align:left;display:block;padding:4px 0}
.row-main b{display:block;font-weight:600;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:12px;line-height:16px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{min-width:76px;height:48px;padding:0 10px;border-radius:14px;border:1px solid var(--outline-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.pill.tonal{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.pill .pl{font-size:11px;line-height:14px;opacity:.8}
.pill .pv{font-size:15px;line-height:18px;font-weight:700;white-space:nowrap}
.group-h{font-size:14px;font-weight:600;color:var(--primary);margin:8px 4px 0}
.badge{height:20px;min-width:20px;padding:0 6px;border-radius:6px;background:var(--tertiary-container);color:var(--on-tertiary-container);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.star{color:var(--on-surface-variant)}
.star[aria-pressed="true"]{color:var(--primary)}
.qty{display:flex;align-items:center;flex:none}
.qty button{width:36px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--on-surface-variant)}
.qty b{min-width:24px;text-align:center;font-size:15px}

/* Slots */
.slot-row{display:flex;align-items:center;gap:12px;min-height:40px}
.slot-row .lv{width:68px;font-weight:500;white-space:nowrap}
.pips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.pip{width:34px;height:26px;border-radius:13px;border:2px solid var(--outline);transition:.15s}
.pip.on{background:var(--primary);border-color:var(--primary)}
.slot-row .cnt{width:32px;text-align:right;font-size:13px;color:var(--on-surface-variant)}
.sblock{display:flex;flex-direction:column;gap:4px}

/* Coins */
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.coin{display:flex;flex-direction:column;align-items:center;gap:2px}
.coin input{width:100%;height:44px;border-radius:12px;border:0;background:var(--sc-highest);text-align:center;font-size:16px;font-weight:600;color:var(--on-surface);outline:0;-moz-appearance:textfield;padding:0}
.coin input:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.coin input::-webkit-outer-spin-button,.coin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.coin span{font-size:11px;color:var(--on-surface-variant);font-weight:600}

/* Segmented */
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;flex:none}
.seg button{flex:1;height:40px;font-weight:500;font-size:14px;border-left:1px solid var(--outline);color:var(--on-surface)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}

/* Text fields */
.tf{display:flex;flex-direction:column;gap:2px;background:var(--sc-highest);border-radius:16px;padding:8px 16px 10px;border:2px solid transparent;transition:border-color .15s}
.tf:focus-within{border-color:var(--primary)}
.tf>span{font-size:12px;line-height:16px;color:var(--on-surface-variant)}
.tf input,.tf select,.tf textarea{background:none;border:0;outline:0;color:var(--on-surface);font-size:16px;line-height:24px;padding:0;width:100%;min-width:0}
.tf textarea{resize:none;min-height:84px;line-height:22px}
.tf select{appearance:none}
.tf select option{background:var(--sc-high);color:var(--on-surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fields{display:flex;flex-direction:column;gap:12px}
.fields input[type="number"]{-moz-appearance:textfield}

/* Switch */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;padding:4px 4px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;border:2px solid var(--outline);background:var(--sc-highest);transition:.2s}
.sw i::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.2s}
.sw input:checked+i{background:var(--primary);border-color:var(--primary)}
.sw input:checked+i::after{left:22px;top:2px;width:24px;height:24px;background:var(--on-primary)}
.sw input:focus-visible+i{outline:3px solid var(--primary);outline-offset:2px}

/* Sheet */
#sheet-root{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sc-low);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,0,0,1)}
.open .sheet{transform:none}
.handle{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.4;margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 4px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:20px;line-height:28px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-body p{margin:0;color:var(--on-surface-variant)}
.big-step{display:flex;align-items:center;justify-content:center;gap:16px}
.big-step button{width:56px;height:56px;border-radius:50%;background:var(--secondary-container);color:var(--on-secondary-container);font-size:28px}
.big-step input{width:96px;height:72px;font-size:48px;font-weight:700;text-align:center;background:none;border:0;outline:0;color:var(--on-surface);-moz-appearance:textfield}
.big-step input::-webkit-outer-spin-button,.big-step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mod-big{text-align:center;font-size:20px;font-weight:600;color:var(--primary)}
.dice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dice-grid button{height:64px;border-radius:16px;background:var(--secondary-container);color:var(--on-secondary-container);font-weight:700;font-size:18px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:48px;height:48px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center}
.swatch[aria-pressed="true"]{border-color:var(--on-surface)}
input[type=range].hue{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;outline-offset:6px;background:linear-gradient(90deg,hsl(0 65% 55%),hsl(60 65% 50%),hsl(120 55% 45%),hsl(180 60% 45%),hsl(240 65% 60%),hsl(300 60% 55%),hsl(360 65% 55%))}
input[type=range].hue::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:4px solid var(--primary)}
input[type=range].hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--primary)}
textarea.io{width:100%;min-height:200px;border-radius:16px;border:0;background:var(--sc-highest);color:var(--on-surface);padding:12px;font:12px/16px ui-monospace,Menlo,Consolas,monospace;resize:none;outline:0}
.death{background:var(--error-container);color:var(--on-error-container)}
.death .dots{display:flex;align-items:center;gap:0}
.death .dot i{border-color:currentColor}
.death-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.death-row .lbl{width:64px;font-weight:500}
.death .dot.s[data-p="1"] i{background:var(--primary);border-color:var(--primary)}

/* Menu */
.menu{position:absolute;top:56px;right:8px;z-index:40;min-width:220px;background:var(--sc-high);border-radius:12px;padding:8px 0;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;height:48px;padding:0 16px;font-size:16px}
.menu button:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.menu-scrim{position:absolute;inset:0;z-index:35}
.menu-scrim[hidden]{display:none}

.pk{display:flex;flex-direction:column;gap:0}
.pk .item{width:100%;text-align:left}

function acInfo(){
  const ar=equipped('armatura')[0],sh=equipped('scudo')[0];
  if(!ar&&!sh)return null;
  const dx=abilMod('des'),parts=[],det=[];let base;
  if(ar){const dm=ar.cap===0?0:Math.min(dx,ar.cap==null?99:ar.cap);base=ar.ac+dm;parts.push(ar.name);det.push([ar.name,ar.ac]);det.push(ar.cap===0?['Destrezza (non si applica)',0]:['Destrezza'+(ar.cap!=null&&dx>ar.cap?' (limite +'+ar.cap+')':''),dm]);}
  else{
    base=10+dx;const cls=S.classes.map(c=>c.n);let dd=[['Base',10],['Destrezza',dx]];
    if(cls.includes('Barbaro')&&10+dx+abilMod('cos')>base){base=10+dx+abilMod('cos');dd=[['Base',10],['Destrezza',dx],['Costituzione (Difesa Senza Armatura)',abilMod('cos')]];}
    if(cls.includes('Monaco')&&!sh&&10+dx+abilMod('sag')>base){base=10+dx+abilMod('sag');dd=[['Base',10],['Destrezza',dx],['Saggezza (Difesa Senza Armatura)',abilMod('sag')]];}
    if(S.classes.some(c=>c.n==='Stregone'&&c.sub==='Discendenza Draconica')&&13+dx>base){base=13+dx;dd=[['Resilienza Draconica',13],['Destrezza',dx]];}
    dd.forEach(x=>det.push(x));parts.push('senza armatura');
  }
  if(sh){base+=sh.ac||2;parts.push(sh.name);det.push([sh.name,sh.ac||2]);}
  if(+S.acBonus){base+=+S.acBonus;det.push(['Bonus extra',+S.acBonus]);}
  return{ac:base,parts,det};
}

['Maestro delle Armi su Asta','','Con un’arma ad asta (alabarda, lancia e simili) puoi attaccare con l’altra estremità come azione bonus (1d4 contundente). Chi entra nella tua portata ti provoca un attacco di opportunità.'],
['Sentinella','','Un attacco di opportunità che colpisce porta a 0 la velocità del bersaglio. Chi si Disimpegna ti provoca comunque attacchi di opportunità e, se un nemico attacca un altro entro 1,5 m da te, puoi attaccarlo con la reazione.'],
['Mente Acuta','','+1 a Intelligenza. Sai sempre dove si trova il nord, quante ore mancano all’alba o al tramonto e ricordi tutto ciò che hai visto o sentito nell’ultimo mese.'],
['Sterminatore di Maghi','','Puoi attaccare con la reazione una creatura entro 1,5 m che lancia un incantesimo. Chi colpisci ha svantaggio ai TS di concentrazione e tu hai vantaggio ai TS contro gli incantesimi di creature entro 1,5 m.'],
['Mobile','','+3 m di velocità. Lo Scatto non è rallentato dal terreno difficile e le creature che attacchi in mischia non ti provocano attacchi di opportunità per il resto del turno.'],
['Tenace','','Il massimo dei tuoi PF aumenta di 2 per ogni livello che hai e di 2 a ogni livello successivo.'],
['Osservatore','','+1 a Intelligenza o Saggezza. Leggi il labiale di chi parla e ottieni +5 ai punteggi passivi di Percezione e Indagare.'],
['Tiratore Scelto','','Ignori copertura parziale e tre quarti e non hai svantaggio a lunga gittata. Con un’arma a distanza puoi prendere −5 al tiro per colpire per ottenere +10 ai danni.'],
['Resiliente','','Scegli una caratteristica: ottieni +1 e la competenza nei tiri salvezza di quella caratteristica.']];

const SKD={'Acrobazia':'Restare in piedi in situazioni precarie e fare acrobazie: camminare su una fune, atterrare dopo un salto, rotolare, evitare una caduta.','Addestrare Animali':'Calmare un animale domestico, evitare che una cavalcatura si spaventi, intuire le intenzioni di un animale o guidare la cavalcatura in una manovra rischiosa.','Arcano':'Ricordare nozioni su incantesimi, oggetti magici, simboli occulti, tradizioni magiche, piani di esistenza e relativi abitanti.','Atletica':'Imprese fisiche difficili: scalare, saltare, nuotare, afferrare, spingere o trattenere avversari.','Furtività':'Muoversi di nascosto e in silenzio, nascondersi alla vista, sfuggire a guardie e inseguitori. Si confronta con la Percezione passiva di chi ti cerca.','Indagare':'Cercare indizi e trarne deduzioni: capire dove si trova un oggetto nascosto, che arma ha causato una ferita, dove una struttura è debole, o cosa dice un documento.','Inganno':'Nascondere la verità con parole o gesti: mentire, truffare, travestirsi, fingere, fugare i sospetti, mantenere un volto impassibile.','Intimidire':'Influenzare qualcuno con minacce, ostilità o violenza implicita per ottenere informazioni o spingerlo ad agire.','Intrattenere':'Divertire il pubblico con musica, danza, recitazione, racconti o altre forme di spettacolo.','Intuizione':'Capire le vere intenzioni di una creatura: scoprire se mente, prevedere la sua mossa, leggere linguaggio del corpo e tono di voce. È contrapposta all’Inganno.','Medicina':'Stabilizzare un compagno morente (azione, CD 10) o diagnosticare una malattia.','Natura':'Ricordare informazioni su terreno, piante, animali, clima e cicli naturali.','Percezione':'Avvistare, udire o notare in altro modo qualcosa: origliare, scoprire una porta segreta, accorgersi di un’imboscata. La Percezione passiva è 10 + bonus.','Persuasione':'Influenzare gli altri con tatto, buone maniere o diplomazia: negoziare, fare una buona impressione, convincere in buona fede.','Rapidità di Mano':'Gesti rapidi e furtivi con le mani: borseggiare, nascondere un oggetto addosso, mettere o togliere qualcosa a qualcuno senza farsi notare.','Religione':'Ricordare nozioni su divinità, riti, preghiere, gerarchie religiose, simboli sacri e culti segreti.','Sopravvivenza':'Seguire tracce, cacciare, guidare il gruppo su terreni difficili, riconoscere la presenza di creature, prevedere il tempo, evitare pericoli naturali.','Storia':'Ricordare eventi storici, popoli leggendari, regni antichi, dispute passate, guerre recenti e civiltà perdute.'};

function featDesc(name,cls){
  const b=String(name).replace(/\s*\([^)]*\)\s*$/,'');
  return CFD[cls+':'+b]||CFD[b]||(/^Privilegio /.test(b)?GENP:null)||(/^Miglioramenti? di /.test(b)?CFD['Miglioramento di']:null)||null;
}

function applyRace(c){
  const r=RTR[c.race];
  c.features=(c.features||[]).filter(f=>!f.r&&f.name!=='Tratti razziali'&&!(r&&r.some(t=>t[0]===f.name)));
  if(r)c.features=[...r.map(t=>({name:t[0],text:t[1],r:1})),...c.features];
}

function subFeats(sub,lv){return(SCF[sub]||[]).filter(x=>x[0]===lv);}
function addSubFeats(ci,from){
  const c=S.classes[ci];if(!c||!c.sub||!SCF[c.sub])return;
  SCF[c.sub].filter(x=>x[0]<=c.l&&x[0]>=from&&!S.features.some(f=>f.name===x[1]&&f.sub===c.sub)).forEach(x=>S.features.push({name:x[1],text:c.sub+': '+x[2],sub:c.sub}));
}

Object.assign(SPD,{"Artificio Druidico": ["Trasmutazione", "1 azione", "9 m", "V, S", "Istantanea", "Piccoli effetti naturali: prevedere il tempo, far sbocciare un fiore, creare un effetto sensoriale o accendere una fiammella."], "Colpo Accurato": ["Divinazione", "1 azione", "9 m", "S", "Concentrazione, fino a 1 round", "Ottieni intuizione sulla difesa di un bersaglio: al tuo prossimo turno hai vantaggio al primo tiro per colpire contro di lui."], "Dardo di Fuoco": ["Invocazione", "1 azione", "36 m", "V, S", "Istantanea", "Tiro per colpire a distanza: 1d10 danni da fuoco; incendia gli oggetti infiammabili non indossati. Il danno sale ai livelli 5, 11 e 17."], "Fiamma Sacra": ["Invocazione", "1 azione", "18 m", "V, S", "Istantanea", "Un bagliore scende su una creatura: TS Destrezza o 1d8 danni radiosi (la copertura non aiuta). Il danno sale ai livelli 5, 11 e 17."], "Frusta di Spine": ["Trasmutazione", "1 azione", "9 m", "S, M", "Istantanea", "Tiro per colpire in mischia: 1d6 danni perforanti e puoi trascinare il bersaglio di 3 m verso di te."], "Guida": ["Divinazione", "1 azione", "Tocco", "V, S", "Concentrazione, fino a 1 minuto", "Una creatura toccata può aggiungere 1d4 a una prova di caratteristica a sua scelta entro la durata."], "Interdizione alle Lame": ["Abiurazione", "1 azione", "Personale", "V, S", "1 round", "Fino alla fine del tuo prossimo turno hai resistenza ai danni contundenti, perforanti e taglienti inflitti da armi."], "Produrre Fiamma": ["Evocazione", "1 azione", "Personale", "V, S", "10 minuti", "Una fiamma nel palmo ti illumina; puoi scagliarla con un attacco a distanza per 1d8 danni da fuoco."], "Resistenza": ["Abiurazione", "1 azione", "Tocco", "V, S, M", "Concentrazione, fino a 1 minuto", "Una creatura toccata può aggiungere 1d4 a un tiro salvezza a sua scelta entro la durata."], "Salvare i Morenti": ["Negromanzia", "1 azione", "Tocco", "V, S", "Istantanea", "Stabilizzi una creatura toccata che ha 0 PF."], "Taumaturgia": ["Trasmutazione", "1 azione", "9 m", "V", "Fino a 1 minuto", "Piccoli prodigi sovrannaturali: voce tonante, fiammelle che tremolano, tremori, suoni, porte che si aprono o sbattono."], "Amicizia": ["Ammaliamento", "1 azione", "Personale", "S, M", "Concentrazione, fino a 1 minuto", "Hai vantaggio alle prove di Carisma contro una creatura non ostile; alla fine la creatura capisce di essere stata influenzata."], "Beffa Crudele": ["Ammaliamento", "1 azione", "18 m", "V", "Istantanea", "Un insulto magico: TS Saggezza o 1d4 danni psichici e svantaggio al prossimo tiro per colpire del bersaglio."], "Amicizia con gli Animali": ["Ammaliamento", "1 azione", "9 m", "V, S, M", "24 ore", "Una bestia (Intelligenza 3 o meno) fa un TS Saggezza o è affascinata e non ti attacca per 24 ore."], "Anatema": ["Ammaliamento", "1 azione", "9 m", "V, S, M", "Concentrazione, fino a 1 minuto", "Fino a tre creature fanno un TS Carisma o sottraggono 1d4 a tiri per colpire e tiri salvezza."], "Armatura di Agathys": ["Abiurazione", "1 azione", "Personale", "V, S, M", "1 ora", "Ottieni 5 PF temporanei; finché li hai, chi ti colpisce in mischia subisce 5 danni da freddo. Scala con lo slot."], "Braccia di Hadar": ["Evocazione", "1 azione", "Personale (raggio di 3 m)", "V, S", "Istantanea", "Tentacoli oscuri esplodono attorno a te: TS Forza o 2d6 danni necrotici e nessuna reazione fino al turno seguente."], "Colpo Intrappolante": ["Evocazione", "1 azione bonus", "Personale", "V", "Concentrazione, fino a 1 minuto", "Il prossimo colpo con arma fa spuntare rovi: TS Forza o il bersaglio è trattenuto e subisce 1d6 perforanti ogni turno."], "Comando": ["Ammaliamento", "1 azione", "18 m", "V", "1 round", "Dai un comando di una parola a una creatura: TS Saggezza o lo esegue nel suo prossimo turno."], "Creare o Distruggere Acqua": ["Trasmutazione", "1 azione", "9 m", "V, S, M", "Istantanea", "Crei fino a 40 litri d’acqua o li distruggi; oppure dissolvi la nebbia in un cubo di 9 m."], "Dardo Tracciante": ["Invocazione", "1 azione", "36 m", "V, S", "1 round", "Tiro per colpire a distanza: 4d6 danni radiosi e il prossimo attacco contro il bersaglio ha vantaggio."], "Duello Obbligato": ["Ammaliamento", "1 azione bonus", "9 m", "V", "Concentrazione, fino a 1 minuto", "Una creatura fa un TS Saggezza o è costretta a combattere solo te, con svantaggio contro gli altri."], "Eroismo": ["Ammaliamento", "1 azione", "Tocco", "V, S", "Concentrazione, fino a 1 minuto", "Una creatura è immune alla paura e all’inizio di ogni suo turno ottiene PF temporanei pari al tuo modificatore."], "Favore Divino": ["Invocazione", "1 azione bonus", "Personale", "V, S", "Concentrazione, fino a 1 minuto", "Azione bonus: i tuoi attacchi con arma infliggono 1d4 danni radiosi extra per 1 minuto."], "Immagine Silenziosa": ["Illusione", "1 azione", "18 m", "V, S, M", "Concentrazione, fino a 10 minuti", "Crei l’immagine di un oggetto, una creatura o un fenomeno (cubo di 4,5 m) senza suono né odori."], "Individuazione del Bene e del Male": ["Divinazione", "1 azione", "Personale", "V, S", "Concentrazione, fino a 10 minuti", "Percepisci aberrazioni, celestiali, elementali, folletti, immondi e non morti entro 9 m, e luoghi consacrati o dissacrati."], "Infliggi Ferite": ["Negromanzia", "1 azione", "Tocco", "V, S", "Istantanea", "Attacco in mischia con incantesimo: 3d10 danni necrotici. +1d10 per ogni slot superiore al 1°."], "Intralciare": ["Evocazione", "1 azione", "27 m", "V, S", "Concentrazione, fino a 1 minuto", "Erbe e rampicanti sorgono in un’area quadrata di 6 m: TS Forza o le creature restano trattenute."], "Nube di Nebbia": ["Evocazione", "1 azione", "36 m", "V, S", "Concentrazione, fino a 1 ora", "Crei una sfera di nebbia (raggio 6 m) che oscura pesantemente la visuale. Si espande con slot superiori."], "Parlare con gli Animali": ["Divinazione", "1 azione", "Personale", "V, S", "10 minuti", "Per 10 minuti capisci e comunichi con le bestie (rituale)."], "Punizione Incandescente": ["Invocazione", "1 azione bonus", "Personale", "V", "Concentrazione, fino a 1 minuto", "Il prossimo colpo con arma infligge 1d6 danni da fuoco extra e il bersaglio può bruciare."], "Raffica di Spine": ["Evocazione", "1 azione bonus", "Personale", "V", "Concentrazione, fino a 1 minuto", "Il prossimo attacco a distanza fa piovere spine: TS Destrezza o 1d10 danni perforanti in un raggio di 1,5 m."], "Punizione Tonante": ["Invocazione", "1 azione bonus", "Personale", "V", "Concentrazione, fino a 1 minuto", "Il prossimo colpo infligge 2d6 danni da tuono e può spingere il bersaglio di 3 m e atterrarlo."], "Purificare Cibo e Bevande": ["Trasmutazione", "1 azione", "3 m", "V, S", "Istantanea", "Rendi sicuri cibo e bevande non magici entro un raggio di 1,5 m (rituale)."], "Raggio di Infermità": ["Negromanzia", "1 azione", "18 m", "V, S", "Istantanea", "Attacco a distanza: 2d8 danni da veleno e il bersaglio può restare avvelenato."], "Ritirata Rapida": ["Trasmutazione", "1 azione bonus", "Personale", "V, S", "Concentrazione, fino a 10 minuti", "Per tutta la durata puoi usare Scatto come azione bonus a ogni turno."], "Saltare": ["Trasmutazione", "1 azione", "Tocco", "V, S, M", "1 minuto", "Una creatura toccata triplica la distanza dei suoi salti per 1 minuto."], "Santuario": ["Abiurazione", "1 azione bonus", "9 m", "V, S, M", "1 minuto", "Azione bonus: una creatura è protetta; chi vuole attaccarla deve prima superare un TS Saggezza."], "Spruzzo Colorato": ["Illusione", "1 azione", "Personale (cono di 4,5 m)", "V, S, M", "1 round", "Un lampo colorato: tiri 6d10 e le creature, dalla più bassa in PF, con PF totali inferiori sono accecate."], "Trova Famiglio": ["Evocazione", "1 ora", "3 m", "V, S, M", "Istantanea", "Evochi uno spirito sotto forma di animale che ti serve da famiglio e può consegnare incantesimi a contatto."], "Onda Tonante": ["Invocazione", "1 azione", "Personale (cubo con spigolo di 4,5 m)", "V, S", "Istantanea", "Un’ondata di tuono nel cubo di 4,5 m davanti a te: TS Costituzione o 2d8 danni da tuono e spinta di 3 m."], "Marchio del Cacciatore": ["Divinazione", "1 azione bonus", "27 m", "V", "Concentrazione, fino a 1 ora", "Azione bonus: segni una creatura; le infliggi +1d6 danni quando la colpisci e rintracciarla è più facile."], "Protezione dal Bene e dal Male": ["Abiurazione", "1 azione", "Tocco", "V, S, M", "Concentrazione, fino a 10 minuti", "Una creatura è protetta da aberrazioni, celestiali, elementali, folletti, immondi e non morti (svantaggio ai loro attacchi)."], "Individuazione delle Malattie e dei Veleni": ["Divinazione", "1 azione", "Personale", "V, M", "Concentrazione, fino a 10 minuti", "Percepisci veleni, creature velenose e malattie entro 9 m (rituale)."], "Globo Cromatico": ["Invocazione", "1 azione", "27 m", "V, S, M", "Istantanea", "Scagli una sfera di energia (acido, freddo, fuoco, fulmine, tuono o veleno): 3d8 danni del tipo scelto."], "Identificare": ["Divinazione", "1 minuto (rituale)", "Tocco", "V, S, M", "Istantanea", "Scopri le proprietà magiche di un oggetto toccato o gli incantesimi attivi su una creatura (rituale)."], "Scudo della Fede": ["Abiurazione", "1 azione bonus", "18 m", "V, S, M", "Concentrazione, fino a 10 minuti", "Azione bonus: una creatura entro 18 m ottiene +2 alla CA per tutta la durata."], "Aura Magica dell’Arcanista": ["Illusione", "1 azione", "Tocco", "V, S, M", "24 ore", "Mascheri la natura magica di un oggetto toccato, o fai sembrare magico un oggetto normale, per 24 ore."], "Crescita di Spine": ["Trasmutazione", "1 azione", "45 m", "V, S, M", "Concentrazione, fino a 10 minuti", "Il terreno in un raggio di 6 m si riempie di spine: chi si muove lì subisce danni perforanti ogni 1,5 m."], "Estasiare": ["Ammaliamento", "1 azione", "18 m", "V, S", "1 minuto", "Le creature che ti vedono e non superano un TS Saggezza restano affascinate dal tuo discorso e ignorano il resto."], "Freccia Acida": ["Invocazione", "1 azione", "27 m", "S, M", "Istantanea", "Attacco a distanza: 4d4 danni da acido subito e altri 2d4 alla fine del turno s function rollD20(label,bonus,parts){
  const m=S.rollMode,a=d(20),b=m==='n'?null:d(20);
  const use=m==='a'?Math.max(a,b):m==='d'?Math.min(a,b):a;
  const dd=b===null?`d20: ${a}`:`d20: ${a}, ${b} → ${use} (${m==='a'?'vantaggio':'svantaggio'})`;
  showRoll({label,total:use+bonus,detail:`${dd} ${sgn(bonus)}${parts&&parts.length?' ('+expl(parts)+')':''}`,tag:use===20?'Critico!':use===1?'Fallimento':'',bad:use===1});
  return use;
}
function rollFormula(f,double){
  const terms=String(f||'').replace(/\s+/g,'').replace(/−/g,'-').match(/[+-]?[^+-]+/g)||[];
  let total=0;const parts=[];
  for(const t of terms){
    const sg=t[0]==='-'?-1:1,body=t.replace(/^[+-]/,''),m=body.match(/^(\d*)d(\d+)$/i);
    if(m){
      const n=(+m[1]||1)*(double?2:1),sides=+m[2];if(sides<1||n>100)continue;
      const rs=Array.from({length:n},()=>d(sides));total+=sg*rs.reduce((x,y)=>x+y,0);
      parts.push(`${sg<0?'−':''}${n}d${sides}[${rs.join(',')}]`);
    }else if(/^\d+$/.test(body)){total+=sg*(+body);parts.push((sg<0?'−':'+')+body);}
  }
  return parts.length?{total,detail:parts.join(' ')}:null;
}

function profMigrate(c){
  if(c.pv)return;c.pv=1;c.profs={lang:[],arm:[],weap:[],tool:[]};
  let t=c.prof||'';const low=t.toLowerCase();
  LANGS.forEach(x=>{if(low.includes(x.toLowerCase())){c.profs.lang.push(x);t=t.replace(new RegExp(x,'i'),'');}});
  [['leggere','Armature leggere'],['medie','Armature medie'],['pesanti','Armature pesanti'],['scudi','Scudi']].forEach(([k,v])=>{if(new RegExp('armature:[^.]*'+k,'i').test(c.prof||'')||(k==='scudi'&&/scudi/i.test(c.prof||''))){c.profs.arm.push(v);t=t.replace(new RegExp(k,'i'),'');}});
  if(/semplici/i.test(c.prof||'')){c.profs.weap.push('Armi semplici');t=t.replace(/semplici/i,'');}
  if(/da guerra/i.test(c.prof||'')){c.profs.weap.push('Armi da guerra');t=t.replace(/da guerra/i,'');}
  PWEAP.slice(2).forEach(x=>{if(low.includes(x.toLowerCase())){c.profs.weap.push(x);t=t.replace(new RegExp(x,'i'),'');}});
  const rest=t.replace(/Linguaggi|Armi|Armature|Strumenti|\be\b|[:.,;\s]/gi,'');
  c.prof=rest?(c.prof||''):'';
}

const root=$('#sheet-root');

const tf=(id,label,val,type='text',extra='')=>`<label class="tf"><span>${label}</span><input id="${id}" type="${type}" value="${esc(val)}" ${type==='number'?'inputmode="decimal"':''} ${extra}></label>`;

const sel=(id,label,opts,val)=>`<label class="tf"><span>${label}</span><select id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`;

const ATKCATS=[['t','Tutte'],['m1','Una mano'],['m2','Due mani'],['dist','Distanza'],['inc','Incantesimi']];
function spellAtks(){
  const L=Object.keys(CL).find(k=>CL[k]===castCls().n);
  const out=[];
  SPELLS.forEach(s=>{
    if(L&&!s[2].includes(L))return;
    const d=SPD[s[0]]||[],note=s[3]||'';
    let m=note.match(/(\d+d\d+(?:\s*\+\s*\d+)?)\s+([a-zàèéìòù]+)/i);
    if(!m)m=(d[5]||'').match(/(\d+d\d+(?:\s*\+\s*\d+)?)[^.]{0,40}?danni\s+(?:da\s+|di\s+)?([a-zàèéìòù]+)/i);
    if(!m)return;
    out.push({n:s[0],s:`${s[1]?'Liv. '+s[1]:'Trucchetto'} · ${m[1].replace(/\s+/g,'')} ${m[2]}`,cat:'inc',d:d[5],m:d.length?[1,2,4].map(k=>d[k]).join(' · '):'',sp:s,dm:m[1].replace(/\s+/g,''),ty:m[2]});
  });
  return out;
}
function weaponAtk(w){
  const ab=w[3]==='f'?(S.abilities.des>=S.abilities.for?'des':'for'):w[3],m=abilMod(ab);
  return{name:w[0],ab,prof:true,bonus:0,dmg:w[1]+(m?(m>0?'+':'-')+Math.abs(m):''),type:w[2]};
}

function toggleEq(i){

function addFeat(n){

function luSave(){
  const{isNew,v,cn,cl,nl}=luCtx();
  if(isNew){const un=unmet(cn);if(un.length&&!chk('lu-ign')){toast('Requisiti non soddisfatti: '+un.join('; '));return false;}}
  const fs=cfAt(cn,nl),asi=fs.includes('ASI'),die=dieOf(cn),cm=abilMod('cos'),tn=S.feats.includes('Tenace')?2:0;
  const mode=asi?val('lu-mode'):'',f=mode==='feat'?val('lu-f'):'';
  if(mode==='feat'&&!f){toast('Scegli un talento.');return false;}
  const roll=val('lu-hp')==='roll'?d(die):Math.floor(die/2)+1,gain=Math.max(1,roll+cm)+tn+(S.race==='Nano delle colline'?1:0);
  if(isNew)S.classes.push({n:cn,l:1,sub:'',hu:0});else S.classes[+v].l=nl;
  sync(S);S.hpMax+=gain;S.hp+=gain;
  if(asi){
    if(mode==='feat'){const o=FASI[f],fa=val('lu-fa');S.feats.push(f);if(f==='Tenace'){S.hpMax+=2*S.level;S.hp+=2*S.level;}if(o)S.featAsi[f]=o.includes(fa)?fa:o[0];}
    else{const a=val('lu-a'),b=val('lu-b');S.inc[a]=(S.inc[a]||0)+1;S.inc[b]=(S.inc[b]||0)+1;}
  }
  recalc();const cm2=abilMod('cos');if(cm2!==cm){S.hpMax+=(cm2-cm)*S.level;S.hp+=(cm2-cm)*S.level;}
  fs.filter(x=>x!=='ASI').forEach(n=>S.features.push({name:n,text:cn+' · livello '+nl}));
  addSubFeats(isNew?S.classes.length-1:+v,nl);
  if(!S.spellAb&&CLASSES[cn].spell){S.spellAb=CLASSES[cn].spell;S.castCls=cn;}
  if(S.autoSlots&&anyCaster())autoSlots();
  persist();render();toast((isNew?'Nuova classe: '+cn+'. ':'')+'Livello '+S.level+': +'+gain+' PF');
}

    <p class="sub">Cambia l’inchiostro dei titoli e dei pulsanti. La pergamena resta quella del manuale; in modalità scura diventa una pagina illuminata dalle candele.</p>`});
}
function ioPanel(){
  openSheet({title:'Esporta o importa',body:`<p>Copia il testo per salvare una copia della scheda, oppure incolla qui un salvataggio e tocca Importa.</p>
    <textarea class="io" id="io-text" spellcheck="false" aria-label="Dati della scheda">${esc(JSON.stringify(S))}</textarea>
    <div class="row2"><button class="btn tonal" data-act="io-copy">Copia</button><button class="btn" data-act="io-import">Importa</button></div>`});
}
function newPanel(){
  openSheet({title:'Nuovo personaggio',body:`<p>Verrà cancellata la scheda attuale e ne comincerai una vuota. Il tema colore resta. Questa azione non si può annullare: se vuoi tenerla, esportala prima.</p>
    <button class="btn danger full" data-act="new-confirm">Cancella e ricomincia</button>`});
}

/* ── Riposi ── */
function shortRestPanel(){
  const body=()=>`<p>Dadi Vita disponibili: <b>${hdLeft()}</b> su ${S.level} (${hdLabel()}). Ogni dado cura il suo valore ${sgn(abilMod('cos'))} PF.</p>
    <div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><span class="v">${S.hp}/${S.hpMax}</span><span class="l">PF</span></div><div class="tile"><span class="v">${hdLeft()}</span><span class="l">Dadi Vita</span></div></div>
    ${S.classes.map((c,i)=>c.n&&c.l-c.hu>0?`<button class="btn tonal full" data-act="rest-hd" data-ci="${i}">Spendi un d${dieOf(c.n)} (${esc(c.n)}, ${c.l-c.hu} rimasti)</button>`:'').join('')||'<p class="sub">Nessun Dado Vita disponibile.</p>'}
    ${S.pactSl?'<p class="sub">Gli slot del patto di warlock si recuperano al termine del riposo.</p>':''}
    <button class="btn full" data-act="rest-end">Termina il riposo</button>`;
  openSheet({title:'Riposo breve',body:body()});
  shortRestPanel.refresh=()=>{const b=$('#sheet-body',root);if(b)b.innerHTML=body();};
}
function longRestPanel(){
  openSheet({title:'Riposo lungo',body:`<p>Recuperi tutti i punti ferita, tutti gli slot incantesimo e metà dei Dadi Vita (almeno uno). L\u2019indebolimento scende di un livello.</p>
    <button class="btn full" data-act="rest-long">Fai riposo lungo</button>`});
}
function spendHD(ci){
  const c=S.classes[ci];
  if(!c||c.l-c.hu<=0){toast('Non hai Dadi Vita disponibili.');return false;}
  const die=dieOf(c.n),r=d(die),cm=abilMod('cos'),heal=Math.max(1,r+cm);
  c.hu++;const before=S.hp;S.hp=Math.min(S.hpMax,S.hp+heal);
  if(before===0&&S.hp>0)S.death={s:0,f:0};
  persist();render();
  showRoll({label:'Dado Vita',total:S.hp-before,detail:`d${die}: ${r} ${sgn(cm)} → +${heal} PF (${S.hp}/${S.hpMax})`});
  return true;
}
function spendHDQuick(){
  const av=S.classes.map((c,i)=>[c,i]).filter(([c])=>c.l-c.hu>0);
  if(!av.length){toast('Non hai Dadi Vita disponibili.');return;}
  if(new Set(av.map(([c])=>dieOf(c.n))).size===1)spendHD(av[0][1]);else shortRestPanel();
}

/* ───────── Azioni ───────── */
function damage(n){
  n=Math.max(0,Math.round(n));if(!n)return;
  let rest=n;if(S.tmp>0){const t=Math.min(S.tmp,rest);S.tmp-=t;rest-=t;}
  S.hp=Math.max(0,S.hp-rest);persist();render();toast(`−${n} PF${S.hp===0?' · sei a 0 PF':''}`);
}
function heal(n){
  n=Math.max(0,Math.round(n));if(!n)return;
  const was=S.hp;S.hp=Math.min(S.hpMax,S.hp+n);if(was===0&&S.hp>0)S.death={s:0,f:0};
  persist();render();toast(`+${S.hp-was} PF (${S.hp}/${S.hpMax})`);
}
function castSpell(i){
  const s=S.spells[i];let L=s.level-1,msg;
  while(L<9&&!(S.slots[L]&&S.slots[L].m-S.slots[L].u>0))L++;
  if(L<9){S.slots[L].u++;msg=`usato slot di livello ${L+1}${L+1>s.level?' (potenziato)':''}`;}
  else if(S.pactSl&&s.level<=S.pactSl.l&&S.pactSl.n-S.pactSl.u>0){S.pactSl.u++;msg=`usato slot del patto (livello ${S.pactSl.l})`;}
  else{toast(`Nessuno slot disponibile di livello ${s.level} o superiore.`);return;}
  if(s.conc)S.conc=s.name;persist();render();toast(`${s.name}: ${msg}`);
}
function doRest(kind){
  if(kind==='long'){
    S.hp=S.hpMax;S.tmp=0;S.death={s:0,f:0};
    let n=Math.max(1,Math.floor(S.level/2));
    S.classes.slice().sort((a,b)=>dieOf(b.n)-dieOf(a.n)).forEach(c=>{const k=Math.min(n,c.hu);c.hu-=k;n-=k;});
    S.rageU=0;S.raging=false;resReset('long');S.slots.forEach(x=>x.u=0);if(S.pactSl)S.pactSl.u=0;S.exh=Math.max(0,S.exh-1);S.conc='';
    toast('Riposo lungo completato.');
  }else{if(S.pactSl)S.pactSl.u=0;resReset('short');toast('Riposo breve completato.');}
  persist();render();
}

/* ───────── Eventi ───────── */
function closeMenu(){$('#menu').hidden=true;$('#menu-scrim').hidden=true;}
function cycleStep(el,dd){
  const inp=$('#'+el.dataset.for,root);if(!inp)return;
  const mn=inp.min!==''?+inp.min:-1e9,mx=inp.max!==''?+inp.max:1e9;
  inp.value=clamp((parseFloat(inp.value)||0)+dd,mn,mx);inp.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('click',e=>{
  if(Date.now()-lpAt<800){lpAt=0;return;}
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('#menu'))closeMenu();return;}
  const act=el.dataset.act,D=el.dataset,i=+D.i;
  if(act!=='menu')closeMenu();
  switch(act){
    case 'nav':tab=D.t;render(true);break;
    case 'menu':{const hid=$('#menu').hidden;$('#menu').hidden=!hid;$('#menu-scrim').hidden=!hid;break;}
    case 'cycle-mode':S.rollMode=S.rollMode==='n'?'a':S.rollMode==='a'?'d':'n';persist();renderTop();break;
    case 'edit-profile':editProfile();break;
    case 'm-dice':dicePanel();break;
    case 'm-theme':themePanel();break;
    case 'm-io':ioPanel();break;
    case 'm-new':wizard();break;
    case 'm-chars':charsPanel();break;
    case 'm-upd':updPanel();break;
    case 'upd-save':{const u=val('upd-url').trim();window.AndroidApp.setUrl(u);toast('Indirizzo salvato.');break;}
    case 'upd-check':{const u=val('upd-url').trim();window.AndroidApp.setUrl(u);window.AndroidApp.check();toast('Controllo in corso…');break;}
    case 'pk-open':PK.open=PK.open===i?-1:i;drawPick();break;
    case 'skill-guide':skillGuide();break;
    case 'skill-roll-close':closeSheet();rollD20(SKILLS[i][0],skillB(i),skillParts(i));break;
    case 'spell-info':spellInfo(i);break;
    case 'spell-edit':closeSheetInstant();editSpell(i);break;
    case 'cast-close':closeSheet();castSpell(i);break;
    case 'level-up':levelUp();break;
    case 'wz-skill':{const n=D.n,k=W.skills.indexOf(n);if(k>=0)W.skills.splice(k,1);else if(W.skills.length<CSK[W.cls].n)W.skills.push(n);drawWizSk();break;}
    case 'ch-sw':R.act=D.id;S=R.list[R.act];recalc();applyTheme();persist();closeSheet();tab='scheda';render(true);break;
    case 'ch-del':{if(!el.dataset.arm){el.dataset.arm=1;el.style.color='var(--error)';toast('Tocca di nuovo per eliminare questo personaggio.');break;}
      delete R.list[D.id];if(R.act===D.id){R.act=Object.keys(R.list)[0];S=R.list[R.act];recalc();applyTheme();}persist();charsPanel();render(true);break;}
    /* scheda */
    case 'edit-stats':editStats();break;
    case 'calc-info':calcSheet();break;
    case 'roll-init':rollD20('Iniziativa',initTot(),initParts());break;
    case 'roll-abil':rollD20('Prova di '+AB[D.k][1],abilMod(D.k),[[AB[D.k][1],abilMod(D.k)]]);break;
    case 'edit-abil':e.stopPropagation();editAbil(D.k);break;
    case 'amt':{AMT=Math.max(0,AMT+ +D.d);const inp=$('#amt');if(inp)inp.value=AMT;break;}
    case 'damage':damage(AMT);break;
    case 'heal':heal(AMT);break;
    case 'prof-t':{S.profs=S.profs||{lang:[],arm:[],weap:[],tool:[]};const a=S.profs[D.g]=S.profs[D.g]||[],k=a.indexOf(D.v);if(k<0)a.push(D.v);else a.splice(k,1);persist();render(true);break;}
    case 'prof-add':{const g=D.g;openSheet({title:'Aggiungi voce',body:`<div class="fields">${tf('pa-v','Nome','')}</div>`,save(){const v=val('pa-v').trim();if(!v)return;S.profs=S.profs||{lang:[],arm:[],weap:[],tool:[]};const a=S.profs[g]=S.profs[g]||[];if(!a.includes(v))a.push(v);persist();render(true);}});break;}
    case 'tog-insp':S.insp=!S.insp;persist();render();break;
    case 'res':{const x=resList().find(r=>r.k===D.k);if(!x)break;S.res=S.res||{};const u=Math.min(S.res[x.k]||0,x.m),av=x.m-u,j=+D.j;S.res[x.k]=j<av?Math.min(x.m,u+1):Math.max(0,u-1);persist();render();break;}
    case 'res-d':{const x=resList().find(r=>r.k===D.k);if(!x)break;S.res=S.res||{};const u=Math.min(S.res[x.k]||0,x.m);S.res[x.k]=clamp(u+ +D.d,0,x.m);persist();render();break;}
    case 'rage-tog':{if(S.raging){S.raging=false;}else{const l=barbL(),mx=rageMax(l);if(mx!==Infinity&&(S.rageU||0)>=mx)break;if(mx!==Infinity)S.rageU=(S.rageU||0)+1;S.raging=true;}persist();render();break;}
    case 'spend-hd':spendHDQuick();break;
    case 'short-rest':shortRestPanel();break;
    case 'long-rest':longRestPanel();break;
    case 'goto-azioni':tab='azioni';render(true);break;
    case 'death':{const t=D.t,n=S.death[t];S.death[t]=n===i+1?i:i+1;persist();render();break;}
    case 'roll-death':{
      const r=d(20);let msg,tag='',bad=false;
      if(r===20){S.hp=1;S.death={s:0,f:0};msg='Torni a 1 PF';tag='Critico!';}
      else if(r===1){S.death.f=Math.min(3,S.death.f+2);msg='Due fallimenti';tag='Fallimento';bad=true;}
      else if(r>=10){S.death.s=Math.min(3,S.death.s+1);msg='Successo';}
      else{S.death.f=Math.min(3,S.death.f+1);msg='Fallimento';bad=true;}
      persist();render();showRoll({label:'Tiro salvezza contro morte',total:r,detail:msg,tag,bad});break;}
    /* abilità */
    case 'roll-save':rollD20('Tiro salvezza '+AB[D.k][1],saveB(D.k),saveParts(D.k));break;
    case 'tog-save':e.stopPropagation();S.saves[D.k]=S.saves[D.k]?0:1;persist();render();break;
    case 'roll-skill':rollD20(SKILLS[i][0],skillB(i),skillParts(i));break;
    case 'cycle-skill':{e.stopPropagation();const n=SKILLS[i][0];S.skills[n]=((S.skills[n]||0)+1)%3;persist();render();break;}
    /* azioni */
    case 'add-atk':pickAtk();break;
    case 'edit-atk':editAtk(i);break;
    case 'roll-atk':{const a=S.attacks[i];rollD20(a.name+': colpire',atkBonus(a),atkParts(a));break;}
    case 'roll-dmg':{const a=S.attacks[i],r=rollFormula(dmgF(a),crit);
      if(!r){toast('Formula del danno non valida. Esempio: 1d8+3');break;}
      showRoll({label:`${a.name}: danno${a.type?' '+a.type:''}`,total:r.total,detail:r.detail,tag:crit?'Critico':''});break;}
    case 'tog-crit':crit=!crit;render();break;
    case 'cond':{const c=D.c,k=S.conds.indexOf(c);if(k>=0)S.conds.splice(k,1);else S.conds.push(c);persist();render();break;}
    case 'exh':S.exh=clamp(S.exh+ +D.d,0,6);persist();render();break;
    /* magie */
    case 'add-spell':pickSpell();break;
    case 'edit-spell':editSpell(i);break;
    case 'prep':S.spells[i].prep=!S.spells[i].prep;persist();render();break;
    case 'cast':castSpell(i);break;
    case 'slot':{const s=S.slots[+D.l],j=+D.j,av=s.m-s.u;s.u=j<av?Math.min(s.m,s.u+1):Math.max(0,s.u-1);persist();render();break;}
    case 'edit-slots':editSlots();break;
    case 'slots-auto':{autoSlots();S.autoSlots=true;persist();render();editSlots();break;}
    case 'edit-spellab':editSpellAb();break;
    case 'drop-conc':S.conc='';persist();render();break;
    case 'cast-cls':S.castCls=D.n;S.spellAb=CLASSES[D.n].spell;persist();render();break;
    case 'pact':{const q=S.pactSl,j=+D.j,av=q.n-q.u;q.u=j<av?Math.min(q.n,q.u+1):Math.max(0,q.u-1);persist();render();break;}
    /* zaino */
    case 'ztab':zTab=D.z;render(true);break;
    case 'add-item':pickItem();break;
    case 'add-talent':pickFeat();break;
    case 'del-talent':delFeat(i);persist();render();break;
    case 'pick':PK.onPick(PK.list[i]);persist();closeSheet();render();break;
    case 'pick-custom':{const c=PK.custom;closeSheetInstant();c();break;}
    case 'it-cat':{PK.list=D.c==='t'?PK_IT:PK_IT.filter(e=>e.cat===D.c);root.querySelectorAll('#it-cats .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.c===D.c)));PK.open=-1;drawPick();break;}
    case 'eq-tog':toggleEq(i);break;
    case 'atk-cat':{PK.list=D.c==='t'?PK_ATK:PK_ATK.filter(e=>e.cat===D.c);root.querySelectorAll('#atk-cats .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.c===D.c)));PK.open=-1;drawPick();break;}
    case 'sp-all':{const on=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!on));PK.list=on?PK.all:PK.mine;drawPick();break;}
    case 'edit-item':editItem(i);break;
    case 'qty':S.items[i].qty=Math.max(0,S.items[i].qty+ +D.d);persist();render();break;
    case 'add-feat':editFeat(-1);break;
    case 'edit-feat':editFeat(i);break;
    /* sheet */
    case 'close-sheet':closeSheet();break;
    case 'sheet-save':if(sheetCb&&sheetCb()===false)break;closeSheet();break;
    case 'sheet-del':if(sheetDel){sheetDel();closeSheet();}break;
    case 'step':cycleStep(el,+D.d);break;
    case 'die':{const n=+D.n,r=d(n);showRoll({label:'d'+n,total:r,detail:n===20&&S.rollMode!=='n'?'Usa il pulsante di un\u2019abilità per vantaggio e svantaggio':'Tiro libero',tag:n===20&&r===20?'Critico!':n===20&&r===1?'Fallimento':'',bad:n===20&&r===1});break;}
    case 'theme-mode':S.theme.mode=D.v;persist();applyTheme();themePanelRefresh();break;
    case 'theme-hue':S.theme.hue=+D.h;persist();applyTheme();themePanelRefresh();break;
    case 'io-copy':{const t=$('#io-text',root);t.select();
      (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Copiato negli appunti.'),()=>{try{document.execCommand('copy');toast('Copiato negli appunti.');}catch(x){toast('Seleziona il testo e copialo a mano.');}});break;}
    case 'io-import':{try{const o=JSON.parse($('#io-text',root).value);if(!o||typeof o!=='object'||!o.abilities)throw 0;S=Object.assign(blank(),o);if(!S.base){S.base={...S.abilities};S.noRace=1;}R.list[R.act]=S;sync(S);recalc();persist();applyTheme();closeSheet();render(true);toast('Scheda importata.');}catch(x){toast('Testo non valido: incolla un salvataggio esportato da qui.');}break;}
    case 'new-confirm':{const th=S.theme;S=blank();S.theme=th;persist();closeSheet();tab='scheda';render(true);toast('Nuova scheda creata. Tocca il nome per compilarla.');break;}
    case 'rest-hd':spendHD(+D.ci);shortRestPanel.refresh&&shortRestPanel.refresh();break;
    case 'rest-end':doRest('short');closeSheet();break;
    case 'rest-long':doRest('long');closeSheet();break;
  }
});
function themePanelRefresh(){const b=$('#sheet-body',root);if(!b)return;const sc=b.scrollTop;closeSheetInstant();themePanel();root.classList.add('open');b.scrollTop=sc;}
function closeSheetInstant(){root.classList.remove('open');root.innerHTML='';}

document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.skill[data-i]');if(!el||e.target.closest('[data-act="cycle-skill"]'))return;
  lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpAt=Date.now();skillInfo(+el.dataset.i);},480);
});
document.addEventListener('pointermove',e=>{if(lpT&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)clearTimeout(lpT);});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpT)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.skill'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(root.classList.contains('open'))closeSheet();else closeMenu();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pk-q'){drawPick();}
  else if(t.id==='amt'){AMT=Math.max(0,parseInt(t.value)||0);}
  else if(t.id==='abil-in'){const m=$('#abil-mod',root);if(m)m.textContent='Modificatore '+sgn(mod(parseInt(t.value)||10));}
  else if(t.dataset&&t.dataset.hue!==undefined){S.theme.hue=+t.value;persist();applyTheme();}
  else if(t.dataset&&t.dataset.bind){
    const path=t.dataset.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
    o[path[path.length-1]]=t.hasAttribute('data-num')?Math.max(0,parseInt(t.value)||0):t.value;
    persist();
  }
});

/* ───────── Avvio ───────── */
document.addEventListener('change',e=>{if(e.target.id==='p-cls'){const sb=$('#p-sub',root);if(sb)sb.innerHTML=oo(SUBS[e.target.value]||[],'').map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lu-c'||t.id==='lu-nc')drawLU();
  if(t.id==='lu-mode')root.querySelectorAll('[data-grp]').forEach(g=>g.hidden=g.dataset.grp!==t.value);
  if(t.id==='wz-cls'&&W){W.cls=t.value;W.skills=[];const st=stdFor(t.value);ABIL.forEach(a=>{$('#wz-a-'+a[0],root).value=st[a[0]];});drawWizSk();}
});
function updPanel(){
  const A=window.AndroidApp;if(!A)return;
  openSheet({title:'Aggiornamenti app',body:`<p>Versione della scheda: <b>${A.version()}</b>. Quando c’è rete l’app controlla da sola se ne esiste una più nuova e la usa dalla prossima apertura. I personaggi restano salvati.</p>
    ${tf('upd-url','Indirizzo degli aggiornamenti',A.getUrl(),'url','placeholder="https://nome.github.io/scheda-dnd/" autocapitalize="off" spellcheck="false"')}
    <div class="row2"><button class="btn tonal" data-act="upd-save">Salva</button><button class="btn" data-act="upd-check">Controlla ora</button></div>`});
}
if(window.AndroidApp){const b=$('#m-upd');if(b)b.hidden=false;}
applyTheme();
render(true);
})();
</script>
